name: CI & Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

# ADR-0009: gate de DoD + deploy estático; nada de backend/DB.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: DoD (typecheck, lint, test, docs)
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun run test
          python3 scripts/docs-check
      - name: Build single-file
        run: bun run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
